# About page (English version of the copy approved on 2026-10-01).
lang: en
title: Matheus Haddad
description: Matheus Haddad is an entrepreneur with a master's in AI, teaches graduate and MBA programs and mentors leaders. Journey, education and principles.
bio:
  - "I am an entrepreneur and co-founder of technology, consulting and education companies. I started with [Webgoal](https://www.webgoal.com.br), one of the first agile software development companies in Brazil, which is now a business holding company. [Granatum](https://www.granatum.com.br), [Ateliê de Software](https://atelie.software), [Orgganica](https://www.orgganica.com) and [Escola Lumiar Poços de Caldas](https://www.escolalumiarpocos.com.br) came next."
  - "My first training is technical: I hold a bachelor's degree in Computer Science and a master's in Artificial Intelligence. I later did an MBA in Business Management. Combining that foundation with the experience of building and running companies led me to study autonomy, collaboration and transparency inside organizational structures."
  - "Since 2008, I have built and managed companies on the same bet: more transparent, autonomous and people-centered organizations deliver better results. Agility has been at the center of that path from the start, and it is one of the areas where I have the most experience. Out of that practice came Feedback Canvas, a visual tool for building a feedback culture in teams, adopted by hundreds of teams and turned into a [book](/en/books/) published in 2025."
  - "Innovative education is also part of this journey. The school I co-founded follows the Lumiar Methodology, which proposes an education based on relevance and on developing competencies. In the age of AI, as technical knowledge becomes ever more accessible, I believe that developing people who can decide, collaborate and keep learning matters even more."
  - "I am also a guest professor in graduate and MBA programs, where I talk about digital entrepreneurship, organizational design and new approaches to management. That same content reaches the talks I give at events in Brazil and abroad and the articles I write on management, leadership, AI and software development."
  - "Today my work focuses on AI adoption in organizations and on new approaches to management. I have been studying and practicing the orchestration of AI agents in the software development process. More recently, I also created the concept of Cognitive Coherence and the P-O Fit Diagnostic, which assess how well the way people think, decide and act fits the way the organization works."
