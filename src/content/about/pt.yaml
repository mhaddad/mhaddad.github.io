lang: pt
title: Matheus Haddad
description: Matheus Haddad é empresário, mestre em Inteligência Artificial, professor de pós-graduação e MBA e mentor. Trajetória, formação e princípios.
bio:
  - "Sou empresário e cofundador de empresas de tecnologia, consultoria e educação. Comecei com a [Webgoal](https://www.webgoal.com.br), uma das primeiras empresas de desenvolvimento ágil de software no Brasil, que hoje é uma holding de negócios. Depois vieram o [Granatum](https://www.granatum.com.br), o [Ateliê de Software](https://atelie.software), a [Orgganica](https://www.orgganica.com) e a [Escola Lumiar Poços de Caldas](https://www.escolalumiarpocos.com.br)."
  - "Minha primeira formação é técnica: sou bacharel em Ciência da Computação e mestre em Inteligência Artificial. Depois fiz MBA em Gestão Empresarial. Foi combinando essa base com a experiência de empreender e gerir que passei a estudar autonomia, colaboração e transparência dentro das estruturas organizacionais."
  - "Desde 2008, empreendo e gerencio empresas com a mesma aposta: organizações mais transparentes, autônomas e centradas nas pessoas entregam melhores resultados. A agilidade esteve no centro desse caminho desde o início e é uma das áreas em que tenho mais experiência. Dessa prática nasceu o Feedback Canvas, uma ferramenta visual para criar cultura de feedback em equipes, adotada por centenas de times e transformada em [livro](/livros/) publicado em 2025."
  - "A educação inovadora também faz parte dessa trajetória. A escola que cofundei adota a Metodologia Lumiar, que propõe uma educação baseada em relevância e no desenvolvimento de competências. Em tempos de IA, em que o conhecimento técnico fica cada vez mais acessível, acredito que formar pessoas capazes de decidir, colaborar e continuar aprendendo se torna ainda mais importante."
  - "Também sou professor convidado em cursos de pós-graduação e MBA, onde falo sobre empreendedorismo digital, design organizacional e novas abordagens de gestão. Esse mesmo conteúdo chega às palestras que faço em eventos no Brasil e no exterior e aos artigos que escrevo sobre gestão, liderança, IA e desenvolvimento de software."
  - "Hoje meu trabalho se concentra na adoção de IA nas organizações e em novas abordagens de gestão. Tenho estudado e praticado a orquestração de agentes de IA no processo de desenvolvimento de software. Recentemente, criei também o conceito de Coerência Cognitiva e o Diagnóstico de P-O Fit, que avaliam a compatibilidade entre a forma como as pessoas pensam, decidem e agem e a forma de trabalhar da organização."
